<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>undo</title>
  <link rel="stylesheet" href="assets/style.css?v=20261011-hallfix1" />
</head>
<body>
  <div id="app">
    <div id="os-bar">
    <span id="os-title"></span>
    <span id="hud">
      <span id="clock"></span>
      <span id="hud-place"></span>
    </span>
    <button type="button" id="sfx-toggle"></button>
    </div>
    <main id="stage"></main>
    <nav id="playbar" aria-label="nav" hidden>
      <div class="playbar-now" aria-hidden="true"></div>
      <div class="playbar-mid">
        <button type="button" id="playbar-house"></button>
        <button type="button" id="playbar-notes"></button>
        <button type="button" id="playbar-map"></button>
      </div>
      <div class="playbar-go">
        <button type="button" id="playbar-advance" hidden>
          <span class="go-mark"></span>
          <span class="go-copy">
            <span class="go-when"></span>
            <span class="go-where"></span>
          </span>
          <span class="go-arrow" aria-hidden="true"></span>
        </button>
      </div>
    </nav>
    <button type="button" id="map-toggle" hidden tabindex="-1" aria-hidden="true"></button>
    <button type="button" id="notes-toggle" hidden tabindex="-1" aria-hidden="true"></button>
    <div id="map-layer" hidden>
      <div id="map-sheet" role="dialog" aria-label="map">
        <header>
          <h2 id="map-title"></h2>
          <p id="map-here"></p>
          <button type="button" id="map-close"></button>
        </header>
        <div id="map-tabs"></div>
        <p id="map-span" hidden></p>
        <div id="map-main">
          <div id="map-draw"></div>
          <aside id="map-detail"></aside>
        </div>
      </div>
    </div>
    <div id="notes-layer" hidden>
      <div id="notes-book" class="diary-sheet" role="dialog" aria-label="notes">
        <div class="diary-wire" aria-hidden="true"></div>
        <div class="diary-page">
          <div id="notes-index" class="diary-sheet-inner">
            <div class="diary-meta">
              <span class="diary-kind" id="notes-kind"></span>
            </div>
            <div id="diary-flow"></div>
          </div>
          <div id="notes-leaf" class="diary-sheet-inner" hidden></div>
          <div id="notes-actions" class="diary-actions"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/pics.js?v=20261011-hallfix1"></script>
  <script src="assets/sfx.js?v=20261011-keycap7b"></script>
  <script src="assets/core.js?v=20261011-hallfix1"></script>
  <script src="assets/ui.js?v=20261011-hallfix1"></script>
  <script src="assets/diary.js?v=20261011-hallfix1"></script>
  <script src="assets/web.js?v=20261011-hallfix1"></script>
  <script src="assets/talk.js?v=20261011-hallfix1"></script>
  <script src="assets/hub.js?v=20261011-hallfix1"></script>
  <script src="assets/story.js?v=20261011-hallfix1"></script>
  <script src="assets/levels.js?v=20261011-hallfix1"></script>
  <script src="assets/map.js?v=20261011-hallfix1"></script>
  <script src="assets/main.js?v=20261011-hallfix1"></script>
</body>
</html>
